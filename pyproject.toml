[project]
name = "mcp-code-snippets"
version = "0.1.0"
description = "Intermediate MCP server for code snippets search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp-server-qdrant",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.uv.sources]
mcp-server-qdrant = { git = "https://github.com/qdrant/mcp-server-qdrant.git", branch = "filters" }

[project.scripts]
mcp-code-snippets = "mcp_code_snippets.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mcp_code_snippets"]
